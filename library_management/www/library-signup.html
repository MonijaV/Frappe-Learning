
<!DOCTYPE html>
<html>

<head>
    <title>Library Signup</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .signup-card{

            width:100%;
            max-width:850px;

            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(12px);

            border-radius:20px;

            display:flex;

            overflow:hidden;

            box-shadow:0px 20px 60px rgba(0,0,0,.35);

        }

        .left{

            width:40%;

            background:rgba(255,255,255,.08);

            color:white;

            padding:50px 35px;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .left h1{

            font-size:40px;
            margin-bottom:20px;

        }

        .left p{

            line-height:28px;
            font-size:17px;
            opacity:.9;

        }

        .right{

            width:60%;

            background:white;

            padding:50px;

        }

        .right h2{

            text-align:center;

            color:#1e3a8a;

            margin-bottom:35px;

            font-size:32px;

        }

        .row{

            display:flex;
            gap:20px;
        }

        .form-group{

            margin-bottom:20px;
            width:100%;
        }

        label{

            display:block;

            margin-bottom:8px;

            color:#374151;

            font-weight:bold;
        }

        input,
        textarea,
        select{

            width:100%;

            padding:14px;

            border-radius:10px;

            border:1px solid #d1d5db;

            outline:none;

            font-size:15px;

            transition:.3s;
        }

        input:focus,
        textarea:focus,
        select:focus{

            border-color:#2563eb;

            box-shadow:0px 0px 8px rgba(37,99,235,.3);

        }

        textarea{

            resize:none;
            height:90px;
        }

        button{

            width:100%;

            padding:16px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:17px;

            cursor:pointer;

            transition:.3s;
        }

        button:hover{

            background:#1d4ed8;

            transform:translateY(-2px);

        }

        .login{

            margin-top:20px;

            text-align:center;
        }

        .login a{

            text-decoration:none;

            color:#2563eb;

            font-weight:bold;
        }

        @media(max-width:768px){

            .signup-card{

                flex-direction:column;
            }

            .left,
            .right{

                width:100%;
            }

            .row{

                flex-direction:column;
                gap:0px;
            }

            .left{

                text-align:center;
            }

        }

    </style>

</head>

<body>

<div class="signup-card">

    <div class="left">

        <h1>📚 Library Portal</h1>

        <p>

            Welcome to the Library Management System.

            Create your account to explore books, borrow resources,
            and manage your library membership easily.

        </p>

    </div>

    <div class="right">

        <h2>Create Account</h2>

        <form id="signup-form">

            <div class="row">

                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        id="first_name"
                        required>

                </div>

                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        id="last_name"
                        required>

                </div>

            </div>

            <div class="row">

                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        id="phone"
                        required>

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    required>

            </div>

            <div class="form-group">

                <label>Occupation</label>

                <select id="occupation">

                    <option>Student</option>

                    <option>Teacher</option>

                    <option>Researcher</option>

                    <option>Employee</option>

                    <option>Other</option>

                </select>

            </div>

            <div class="form-group">

                <label>Address</label>

                <textarea id="address"></textarea>

            </div>

            <button type="submit">

                Create Account

            </button>

        </form>

        <div class="login">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>

    </div>

</div>
<script>

document
.getElementById("signup-form")
.addEventListener("submit",function(e){

e.preventDefault();

frappe.call({

    method:"library_management.api.signup_user",

    args:{

        first_name:document.getElementById("first_name").value,

        last_name:document.getElementById("last_name").value,

        phone:document.getElementById("phone").value,

        email:document.getElementById("email").value,

        password:document.getElementById("password").value,

        address:document.getElementById("address").value,

        occupation:document.getElementById("occupation").value

    },

    callback:function(r){

        frappe.msgprint(r.message.message);

        document.getElementById("signup-form").reset();

    }

});

});

</script>
</body>

</html>
